# Prefix: backtick
unbind C-b
set -g prefix `
bind ` send-prefix

# Screen-style key bindings
unbind ^X
bind ^X lock-server
unbind x
bind x lock-server

unbind ^C
bind ^C new-window
unbind c
bind c new-window

unbind ^D
bind ^D detach

unbind *
bind * list-clients

# Window navigation
unbind " "
bind " " next-window
unbind n
bind n next-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window

# Swap window/pane
unbind .
bind . swap-window -t -1
unbind ,
bind , swap-pane

# Rename window
unbind A
bind A command-prompt "rename-window %%"

# Last window
unbind ^A
bind ^A last-window

# List windows
unbind ^W
bind ^W list-windows
unbind w
bind w list-windows

# Kill server/pane
unbind '\'
bind '\' confirm-before "kill-server"
unbind K
bind K confirm-before "kill-pane"

# Split window
unbind |
bind | split-window -h
unbind -
bind - split-window -v

# Focus next pane
unbind Tab
bind Tab select-pane -t:.+
unbind BTab

# Copy mode: emacs
setw -g mode-keys emacs

# Pane resize
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Terminal
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Clipboard (OSC 52 — works over ssh/mosh, requires tmux 3.5a+)
set -s set-clipboard on
set-option -as terminal-overrides ",*:Ms=\\E]52;c%p1%.0s;%p2%s\\7"

# Quiet
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

######################
### DESIGN         ###
######################

# Panes
set -g pane-border-style bg=colour235,fg=colour238
set -g pane-active-border-style bg=colour236,fg=colour51

# Modes
setw -g clock-mode-colour colour135
setw -g mode-style bold,fg=colour196,bg=colour238

# Messages
set -g message-style bold,fg=colour232,bg=colour166
set -g message-command-style fg=blue,bg=black

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style fg=colour137,bg=colour234,dim
set -g status-left '[ #[fg=colour190]#h #[fg=colour196]]['
set -g status-left-length 20
set -g status-right '][#[fg=colour255] %Y-%m-%d#[fg=colour255] %H:%M:%S #[fg=colour196]]'
set -g status-right-length 50

# Window status
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style fg=colour255,bg=colour1,bold
